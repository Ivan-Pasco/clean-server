# The M0 acceptance fixture.
#
# `clean-server testing/fixtures/hello-world/host.toml` serves "hello world"
# on http://127.0.0.1:3000/.
#
# [host], [guest], and [runtime] are owned by clean-host-core (CLNH-11);
# [bridges] too. [server] is owned by clean-server.

[host]
name            = "clean-server"
version         = "0.1.0"
component-model = "0.3.0"
deployment-mode = "development"

[guest]
name  = "hello-world"
wasm  = "../../fake-guest/guest.wasm"
world = "clean:host/server@0.1"

[runtime]
# Small pool: the fixture exists to prove the path works, not to be fast.
instances-min = 1
instances-max = 4

[bridges]
# Composed into the guest at startup. The guest imports this interface, so
# per SRVH-01/02 the server refuses to start when this entry is absent.
"clean:fake-bridge/store" = "../../fake-bridge/bridge.wasm"

[server]
listen = "127.0.0.1:3000"
