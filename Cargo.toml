[workspace]
resolver = "2"
members = [
    "crates/clean-server",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
# Inherited from clean-host-core, which needs 1.94 for wasmtime 47.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ivan-Pasco/clean-server"

[workspace.dependencies]
# Sibling repo, developed side by side while both are pre-1.0. These become git
# or registry pins at M1 when clean-host-core stabilizes — the same convention
# clean-framework uses for cln-shared / cln-layout.
clean-host-core = { path = "../clean-host-core/crates/clean-host-core" }
clean-host-core-wasmtime = { path = "../clean-host-core/crates/clean-host-core-wasmtime" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# HTTP stack (PLAN.md §1): hyper directly rather than axum — the server owns
# its own routing and does not need the framework layer.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# TLS. rustls only: the deployment shape (§1.2) promises no shared-object
# dependencies beyond libc, which native-tls/OpenSSL would break.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# WebSocket.
tokio-tungstenite = "0.30"
sha1 = "0.10"
base64 = "0.22"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

wasmtime = "47"

# Test-only: generate TLS certificates on the fly rather than checking PEMs in.
rcgen = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
